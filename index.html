<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="Soluciones Digitales: invitaciones digitales, aplicaciones web, sistemas para instituciones, negocios y emprendimientos.">
  <title>Soluciones Digitales | Invitaciones y Aplicaciones Web</title>
  <style>
    :root{
      --bg:#07111f; --bg2:#0a1730; --card:#0f1f38; --card2:#122745;
      --text:#f7fbff; --muted:#a8bad0; --cyan:#22d3ee; --blue:#3b82f6;
      --violet:#8b5cf6; --line:rgba(255,255,255,.10); --green:#22c55e;
      --shadow:0 20px 60px rgba(0,0,0,.30); --radius:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:
      radial-gradient(circle at 12% 8%,rgba(34,211,238,.10),transparent 28%),
      radial-gradient(circle at 88% 18%,rgba(139,92,246,.10),transparent 30%),
      linear-gradient(180deg,#06101d 0%,#09162b 48%,#07111f 100%);color:var(--text)}
    a{color:inherit;text-decoration:none}
    img{max-width:100%;display:block}
    .container{width:min(1160px,92%);margin:auto}
    .nav-wrap{position:sticky;top:0;z-index:50;background:rgba(6,16,29,.76);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
    nav{height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px}
    .brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.2px}
    .brand img{width:44px;height:44px;border-radius:14px;object-fit:cover}
    .brand span b{color:var(--cyan)}
    .navlinks{display:flex;align-items:center;gap:24px;color:#d4e0ef;font-size:14px;font-weight:700}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;border-radius:14px;padding:13px 18px;font-weight:850;cursor:pointer;transition:.2s ease}
    .btn:hover{transform:translateY(-2px)}
    .btn-primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#03121c;box-shadow:0 12px 28px rgba(34,211,238,.20)}
    .btn-ghost{border:1px solid var(--line);background:rgba(255,255,255,.04);color:white}
    .hero{padding:86px 0 72px}
    .hero-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:56px;align-items:center}
    .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.20);color:#94f2ff;font-size:13px;font-weight:800}
    h1{font-size:clamp(44px,6.5vw,78px);line-height:.98;margin:18px 0 20px;letter-spacing:-2.4px}
    .gradient{background:linear-gradient(90deg,#fff 0%,#7dd3fc 48%,#a78bfa 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{font-size:18px;line-height:1.7;color:var(--muted);max-width:700px}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
    .trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:30px;color:#c6d4e5;font-size:13px}
    .trust span{display:flex;align-items:center;gap:7px}
    .hero-visual{position:relative}
    .visual-card{padding:13px;border-radius:32px;background:linear-gradient(145deg,rgba(59,130,246,.22),rgba(139,92,246,.12));border:1px solid var(--line);box-shadow:var(--shadow)}
    .visual-card img{border-radius:23px;aspect-ratio:4/5;object-fit:cover;object-position:center}
    .floating{position:absolute;padding:13px 15px;border-radius:16px;background:rgba(12,31,56,.92);border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow);font-size:13px;font-weight:800}
    .float1{left:-24px;bottom:44px}.float2{right:-18px;top:48px}
    section{padding:78px 0}
    .section-kicker{color:#78e8f5;text-transform:uppercase;letter-spacing:1.7px;font-size:12px;font-weight:900}
    .section-title{font-size:clamp(32px,4.5vw,52px);line-height:1.08;margin:9px 0 13px;letter-spacing:-1.5px}
    .section-desc{color:var(--muted);line-height:1.7;max-width:760px}
    .services{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
    .card{background:linear-gradient(180deg,rgba(18,39,69,.94),rgba(12,29,52,.96));border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 14px 34px rgba(0,0,0,.16)}
    .icon{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,rgba(59,130,246,.28),rgba(34,211,238,.12));border:1px solid rgba(255,255,255,.08)}
    .card h3{font-size:21px;margin:18px 0 9px}.card p{color:var(--muted);line-height:1.65;margin:0}
    .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.tag{padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.05);color:#c7d7e9;font-size:12px;border:1px solid var(--line)}
    .showcase{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:36px}
    .project{overflow:hidden;padding:0}
    .project-img{background:#071426;aspect-ratio:16/10;overflow:hidden}
    .project-img img{width:100%;height:100%;object-fit:cover}
    .project-body{padding:22px}.project-body h3{margin:0 0 8px;font-size:22px}.project-body p{margin:0;color:var(--muted);line-height:1.6}
    .project-link{display:inline-flex;margin-top:14px;color:#67e8f9;font-weight:800;font-size:13px}
    .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
    .gallery figure{margin:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);background:#0b1a30;box-shadow:0 12px 30px rgba(0,0,0,.18)}
    .gallery img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:.35s}.gallery figure:hover img{transform:scale(1.025)}
    .audiences{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:30px}
    .mini{padding:20px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line)}.mini b{display:block;margin-bottom:6px}.mini span{font-size:13px;color:var(--muted)}
    .process{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px;counter-reset:steps}
    .step{position:relative;padding:24px;border-radius:20px;background:rgba(255,255,255,.035);border:1px solid var(--line);counter-increment:steps}
    .step:before{content:"0" counter(steps);display:block;color:#67e8f9;font-weight:950;font-size:13px;margin-bottom:14px}.step h3{margin:0 0 8px;font-size:18px}.step p{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
    .contact-box{display:grid;grid-template-columns:1fr .8fr;gap:22px;align-items:center;padding:38px;border-radius:32px;background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(139,92,246,.12));border:1px solid var(--line);box-shadow:var(--shadow)}
    .contact-box h2{font-size:clamp(32px,4vw,52px);line-height:1.05;margin:0 0 12px}.contact-box p{color:var(--muted);line-height:1.65}
    .contact-form{display:grid;gap:10px}.contact-form input,.contact-form textarea,.contact-form select{width:100%;border:1px solid var(--line);background:#09182c;color:#fff;border-radius:13px;padding:13px 14px;font:inherit;outline:none}.contact-form textarea{min-height:110px;resize:vertical}.contact-form option{background:#09182c}
    footer{padding:34px 0 90px;color:#8fa4bc;border-top:1px solid var(--line);font-size:13px;margin-top:72px}
    .footer-row{display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap}
    .wa-float{position:fixed;right:20px;bottom:20px;z-index:60;background:#25D366;color:#042712;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:27px;font-weight:950;box-shadow:0 12px 34px rgba(37,211,102,.36);border:3px solid rgba(255,255,255,.88)}
    .remote-status{position:fixed;left:14px;bottom:14px;z-index:5;font-size:10px;color:#6f8298;opacity:.55}
    @media(max-width:940px){.hero-grid,.contact-box{grid-template-columns:1fr}.hero-visual{max-width:620px}.services{grid-template-columns:1fr 1fr}.gallery{grid-template-columns:1fr 1fr}.audiences,.process{grid-template-columns:1fr 1fr}.navlinks{display:none}.float1{left:10px}.float2{right:10px}}
    @media(max-width:620px){nav{height:68px}.brand span{font-size:14px}.hero{padding:58px 0 44px}h1{letter-spacing:-1.5px}.hero p{font-size:16px}.services,.showcase,.gallery,.audiences,.process{grid-template-columns:1fr}.floating{position:static;margin-top:10px;display:inline-flex;margin-right:7px}.section-title{letter-spacing:-.8px}.contact-box{padding:24px}.btn{width:100%}.hero-actions .btn{width:auto}.gallery figure img{aspect-ratio:1/1.18}.wa-float{width:54px;height:54px;right:14px;bottom:14px}}
</style>
</head>
<body>
  <div class="nav-wrap">
    <nav class="container">
      <a class="brand" href="#inicio"><img id="brandLogo" src="assets/logo.webp" alt="Logo Soluciones Digitales"><span><span id="brandLeft">SOLUCIONES</span> <b id="brandAccent">DIGITALES</b></span></a>
      <div class="navlinks"><a href="#servicios">Servicios</a><a href="#trabajos">Trabajos</a><a href="#invitaciones">Invitaciones</a><a href="#contacto">Contacto</a></div>
      <a id="navWhatsApp" class="btn btn-primary" target="_blank" rel="noopener"><span id="navWhatsAppLabel">WhatsApp</span></a>
    </nav>
  </div>

  <main id="inicio">
    <header class="hero">
      <div class="container hero-grid">
        <div>
          <span class="pill" id="heroPill"></span>
          <h1><span id="heroTitleMain"></span> <span class="gradient" id="heroTitleAccent"></span></h1>
          <p id="heroDescription"></p>
          <div class="hero-actions">
            <a class="btn btn-primary" href="#contacto" id="heroPrimaryBtn">Solicitar presupuesto</a>
            <a class="btn btn-ghost" href="#trabajos" id="heroSecondaryBtn">Ver nuestros trabajos</a>
          </div>
          <div class="trust" id="trustItems"></div>
        </div>
        <div class="hero-visual">
          <div class="visual-card"><img id="heroImage" alt="Aplicaciones web desarrolladas a medida"></div>
          <div class="floating float1" id="heroFloat1"></div>
          <div class="floating float2" id="heroFloat2"></div>
        </div>
      </div>
    </header>

    <section id="servicios">
      <div class="container"><span class="section-kicker" id="servicesKicker"></span><h2 class="section-title" id="servicesTitle"></h2><p class="section-desc" id="servicesDescription"></p><div class="services" id="servicesGrid"></div></div>
    </section>

    <section id="trabajos">
      <div class="container"><span class="section-kicker" id="portfolioKicker"></span><h2 class="section-title" id="portfolioTitle"></h2><p class="section-desc" id="portfolioDescription"></p><div class="showcase" id="projectsGrid"></div></div>
    </section>

    <section id="invitaciones">
      <div class="container"><span class="section-kicker" id="invitationsKicker"></span><h2 class="section-title" id="invitationsTitle"></h2><p class="section-desc" id="invitationsDescription"></p><div class="gallery" id="invitationsGrid"></div></div>
    </section>

    <section id="rubros">
      <div class="container"><span class="section-kicker" id="audiencesKicker"></span><h2 class="section-title" id="audiencesTitle"></h2><div class="audiences" id="audiencesGrid"></div></div>
    </section>

    <section id="proceso">
      <div class="container"><span class="section-kicker" id="processKicker"></span><h2 class="section-title" id="processTitle"></h2><div class="process" id="processGrid"></div></div>
    </section>

    <section id="contacto">
      <div class="container"><div class="contact-box"><div><span class="section-kicker" id="contactKicker"></span><h2 id="contactTitle"></h2><p id="contactDescription"></p></div><form class="contact-form" id="waForm"><input id="name" type="text" placeholder="Tu nombre" required><select id="service" required></select><textarea id="message" placeholder="Contanos tu idea o necesidad" required></textarea><button class="btn btn-primary" type="submit" id="contactButtonLabel">Enviar consulta por WhatsApp</button></form></div></div>
    </section>
  </main>

  <footer><div class="container footer-row"><div>© <span id="year"></span> Soluciones Digitales.</div><div id="footerText"></div></div></footer>
  <a id="waFloat" class="wa-float" aria-label="WhatsApp" target="_blank" rel="noopener">✆</a>
  <div class="remote-status" id="remoteStatus"></div>

  <script>
    // PEGÁ AQUÍ la URL /exec de tu Google Apps Script.
    // Mientras no la pegues, la página seguirá funcionando con el contenido actual.
    const SD_BACKEND_URL = 'PEGAR_AQUI_URL_APPS_SCRIPT';
    const SD_DEFAULT_DATA = {"site": {"brandLeft": "SOLUCIONES", "brandAccent": "DIGITALES", "logo": "assets/logo.webp", "whatsapp": "5493816124427", "whatsappMessage": "Hola Soluciones Digitales, quiero hacer una consulta", "navWhatsAppLabel": "WhatsApp", "heroPrimaryLabel": "Solicitar presupuesto", "heroSecondaryLabel": "Ver nuestros trabajos", "contactButtonLabel": "Enviar consulta por WhatsApp", "trustItems": ["✓ Diseño personalizado", "✓ Adaptado a celular", "✓ Atención directa"], "heroPill": "✦ Diseño + desarrollo a medida", "heroTitleMain": "Convertimos tus ideas en", "heroTitleAccent": "soluciones digitales.", "heroDescription": "Diseñamos invitaciones digitales y desarrollamos aplicaciones web para instituciones, negocios, profesionales y emprendimientos. Soluciones modernas, simples y adaptadas a cada necesidad.", "heroImage": "assets/apps-medida.webp", "heroFloat1": "🌐 Aplicaciones web", "heroFloat2": "💌 Invitaciones digitales", "servicesKicker": "Qué hacemos", "servicesTitle": "Servicios pensados para crecer con vos", "servicesDescription": "No usamos una única solución para todos. Diseñamos cada proyecto según el objetivo, el público y la forma de trabajo de cada cliente.", "portfolioKicker": "Portfolio", "portfolioTitle": "Algunos trabajos y soluciones", "portfolioDescription": "Proyectos orientados a resolver necesidades concretas, con interfaces simples y funcionamiento adaptable a PC, tablet y celular.", "invitationsKicker": "Invitaciones digitales", "invitationsTitle": "Tu evento empieza antes de llegar", "invitationsDescription": "Creamos una experiencia visual que podés compartir por WhatsApp o redes, con toda la información del evento organizada en un solo lugar.", "audiencesKicker": "¿Para quién?", "audiencesTitle": "Soluciones para distintos rubros", "processKicker": "Cómo trabajamos", "processTitle": "De la idea a una solución lista para usar", "contactKicker": "Contacto", "contactTitle": "¿Tenés una idea? Hagámosla digital.", "contactDescription": "Contanos brevemente qué necesitás. El botón enviará tu consulta directamente por WhatsApp a Soluciones Digitales.", "footerText": "Invitaciones digitales · Aplicaciones web · Desarrollo a medida"}, "sections": {"services": true, "projects": true, "invitations": true, "audiences": true, "process": true, "contact": true}, "services": [{"icon": "💌", "title": "Invitaciones digitales", "desc": "Invitaciones elegantes e interactivas para casamientos, 15 años, cumpleaños, bautismos y eventos especiales.", "tags": ["Ubicación", "Confirmación", "Cuenta regresiva"], "visible": true}, {"icon": "🏫", "title": "Aplicaciones institucionales", "desc": "Sistemas para escuelas, institutos y organizaciones: notas, asistencia, boletines, documentación, comunicación y reportes.", "tags": ["Alumnos", "Docentes", "Familias"], "visible": true}, {"icon": "🛍️", "title": "Aplicaciones para negocios", "desc": "Herramientas para turnos, reservas, ventas, stock, pedidos, clientes, gastos y procesos internos.", "tags": ["Ventas", "Stock", "Turnos"], "visible": true}, {"icon": "📊", "title": "Paneles y gestión", "desc": "Dashboards claros con indicadores, estadísticas y controles para tomar decisiones rápidamente.", "tags": ["Reportes", "Estadísticas"], "visible": true}, {"icon": "🎮", "title": "Experiencias interactivas", "desc": "Juegos, actividades educativas, rankings y experiencias web pensadas para aprender o promocionar de otra manera.", "tags": ["Gamificación", "Ranking"], "visible": true}, {"icon": "⚙️", "title": "Desarrollo a medida", "desc": "Si tu idea no entra en una categoría, la analizamos y construimos una solución específica para tu proyecto.", "tags": ["Personalizado", "Responsive"], "visible": true}], "projects": [{"title": "Mis Gastos", "desc": "Aplicación web para organizar ingresos, gastos, cuentas, vencimientos y movimientos desde distintos dispositivos.", "image": "assets/mis-gastos.webp", "link": "", "visible": true}, {"title": "Sistemas para instituciones y negocios", "desc": "Aplicaciones personalizadas para gestión académica, ventas, stock, turnos, pagos, comunicación y administración.", "image": "assets/apps-medida.webp", "link": "", "visible": true}], "invitations": [{"image": "assets/invitacion-boda.webp", "alt": "Invitación digital de casamiento", "visible": true}, {"image": "assets/invitacion-15.webp", "alt": "Invitación digital de 15 años", "visible": true}, {"image": "assets/invitacion-cumple.webp", "alt": "Invitación digital de cumpleaños", "visible": true}, {"image": "assets/invitacion-bautismo.webp", "alt": "Invitación digital de bautismo", "visible": true}], "audiences": [{"title": "🏫 Instituciones educativas", "desc": "Notas, asistencia, boletines, campus y gestión.", "visible": true}, {"title": "🛍️ Comercios", "desc": "Ventas, productos, stock, pedidos y clientes.", "visible": true}, {"title": "💇 Profesionales y servicios", "desc": "Turnos, reservas, agenda y seguimiento.", "visible": true}, {"title": "🚀 Emprendimientos", "desc": "Herramientas a medida para organizar y crecer.", "visible": true}, {"title": "🍽️ Gastronomía", "desc": "Menús, reservas, pedidos y catálogos.", "visible": true}, {"title": "🏋️ Gimnasios y clubes", "desc": "Socios, cuotas, turnos y actividades.", "visible": true}, {"title": "🎉 Eventos", "desc": "Invitaciones, confirmaciones y experiencias digitales.", "visible": true}, {"title": "💡 Tu idea", "desc": "Contanos qué necesitás y analizamos la solución.", "visible": true}], "process": [{"title": "Nos contás tu idea", "desc": "Entendemos qué necesitás, quiénes la van a usar y qué problema debe resolver.", "visible": true}, {"title": "Diseñamos la propuesta", "desc": "Definimos funciones, estética y experiencia antes de avanzar con el desarrollo.", "visible": true}, {"title": "Desarrollamos", "desc": "Construimos una solución adaptable, clara y pensada para funcionar en distintos dispositivos.", "visible": true}, {"title": "Publicamos y acompañamos", "desc": "Dejamos el proyecto listo para usar y realizamos los ajustes acordados.", "visible": true}], "contactOptions": ["Invitación digital", "Aplicación para institución", "Aplicación para negocio", "Sitio web", "Otra solución"]};
    let SD_DATA = SD_DEFAULT_DATA;

    const esc = (s='') => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const visible = arr => (arr || []).filter(x => x.visible !== false);
    const setText = (id,val='') => { const el=document.getElementById(id); if(el) el.textContent=val; };
    const section = (id,on) => { const el=document.getElementById(id); if(el) el.style.display = on===false ? 'none' : ''; };

    function waUrl(data, customText) {
      const n=(data.site.whatsapp||'').replace(/\D/g,'');
      const text=customText || data.site.whatsappMessage || 'Hola, quiero hacer una consulta';
      return `https://wa.me/${n}?text=${encodeURIComponent(text)}`;
    }

    function renderSite(data) {
      if(!data || !data.site) return;
      SD_DATA = data;
      const s=data.site;
      document.getElementById('brandLogo').src=s.logo||'assets/logo.webp';
      setText('brandLeft',s.brandLeft); setText('brandAccent',s.brandAccent); setText('navWhatsAppLabel',s.navWhatsAppLabel||'WhatsApp');
      setText('heroPill',s.heroPill); setText('heroTitleMain',s.heroTitleMain); setText('heroTitleAccent',s.heroTitleAccent); setText('heroDescription',s.heroDescription); setText('heroPrimaryBtn',s.heroPrimaryLabel||'Solicitar presupuesto'); setText('heroSecondaryBtn',s.heroSecondaryLabel||'Ver nuestros trabajos'); document.getElementById('trustItems').innerHTML=(s.trustItems||[]).map(x=>`<span>${esc(x)}</span>`).join('');
      document.getElementById('heroImage').src=s.heroImage||'assets/apps-medida.webp'; setText('heroFloat1',s.heroFloat1); setText('heroFloat2',s.heroFloat2);
      setText('servicesKicker',s.servicesKicker); setText('servicesTitle',s.servicesTitle); setText('servicesDescription',s.servicesDescription);
      setText('portfolioKicker',s.portfolioKicker); setText('portfolioTitle',s.portfolioTitle); setText('portfolioDescription',s.portfolioDescription);
      setText('invitationsKicker',s.invitationsKicker); setText('invitationsTitle',s.invitationsTitle); setText('invitationsDescription',s.invitationsDescription);
      setText('audiencesKicker',s.audiencesKicker); setText('audiencesTitle',s.audiencesTitle); setText('processKicker',s.processKicker); setText('processTitle',s.processTitle);
      setText('contactKicker',s.contactKicker); setText('contactTitle',s.contactTitle); setText('contactDescription',s.contactDescription); setText('contactButtonLabel',s.contactButtonLabel||'Enviar consulta por WhatsApp'); setText('footerText',s.footerText);

      const navWA=document.getElementById('navWhatsApp'), floatWA=document.getElementById('waFloat'); navWA.href=waUrl(data); floatWA.href=waUrl(data);

      document.getElementById('servicesGrid').innerHTML=visible(data.services).map(x=>`<article class="card"><div class="icon">${esc(x.icon)}</div><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p><div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></article>`).join('');
      document.getElementById('projectsGrid').innerHTML=visible(data.projects).map(x=>`<article class="card project"><div class="project-img"><img src="${esc(x.image)}" alt="${esc(x.title)}"></div><div class="project-body"><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p>${x.link?`<a class="project-link" href="${esc(x.link)}" target="_blank" rel="noopener">Ver proyecto →</a>`:''}</div></article>`).join('');
      document.getElementById('invitationsGrid').innerHTML=visible(data.invitations).map(x=>`<figure><img src="${esc(x.image)}" alt="${esc(x.alt)}"></figure>`).join('');
      document.getElementById('audiencesGrid').innerHTML=visible(data.audiences).map(x=>`<div class="mini"><b>${esc(x.title)}</b><span>${esc(x.desc)}</span></div>`).join('');
      document.getElementById('processGrid').innerHTML=visible(data.process).map(x=>`<div class="step"><h3>${esc(x.title)}</h3><p>${esc(x.desc)}</p></div>`).join('');
      document.getElementById('service').innerHTML='<option value="">¿Qué necesitás?</option>'+((data.contactOptions||[]).map(x=>`<option>${esc(x)}</option>`).join(''));

      section('servicios',data.sections?.services); section('trabajos',data.sections?.projects); section('invitaciones',data.sections?.invitations); section('rubros',data.sections?.audiences); section('proceso',data.sections?.process); section('contacto',data.sections?.contact);
    }

    window.SD_applyRemoteData = function(data) { renderSite(data); document.getElementById('remoteStatus').textContent=''; };

    function loadRemoteData() {
      if(!SD_BACKEND_URL || SD_BACKEND_URL.includes('PEGAR_AQUI')) return;
      const sc=document.createElement('script');
      sc.src=SD_BACKEND_URL + (SD_BACKEND_URL.includes('?')?'&':'?') + 'callback=SD_applyRemoteData&_=' + Date.now();
      sc.onerror=()=>{document.getElementById('remoteStatus').textContent='Contenido local';};
      document.head.appendChild(sc);
    }

    document.getElementById('year').textContent=new Date().getFullYear();
    document.getElementById('waForm').addEventListener('submit',function(e){
      e.preventDefault();
      const n=document.getElementById('name').value.trim(); const s=document.getElementById('service').value; const m=document.getElementById('message').value.trim();
      const text=`Hola Soluciones Digitales. Soy ${n}.
Estoy interesado/a en: ${s}.

${m}`;
      window.open(waUrl(SD_DATA,text),'_blank');
    });
    renderSite(SD_DEFAULT_DATA); loadRemoteData();
  </script>
</body>
</html>
