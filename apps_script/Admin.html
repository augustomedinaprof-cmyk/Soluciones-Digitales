<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administrador | Soluciones Digitales</title>
<style>
:root{--bg:#07111f;--panel:#0e1d33;--panel2:#132744;--text:#f7fbff;--muted:#9eb2c9;--cyan:#22d3ee;--blue:#3b82f6;--violet:#8b5cf6;--red:#ef4444;--green:#22c55e;--line:rgba(255,255,255,.11)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(145deg,#06101d,#0a1730);color:var(--text);min-height:100vh}button,input,textarea,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);padding:30px;border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.35)}.login-card h1{margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}
input,textarea,select{width:100%;background:#071528;border:1px solid var(--line);color:white;border-radius:12px;padding:11px 12px;outline:none}textarea{min-height:90px;resize:vertical}label{display:block;font-size:12px;font-weight:800;color:#c8d7e8;margin:0 0 6px}.field{margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(90deg,var(--blue),var(--cyan));color:#06101d}.soft{background:#172c4a;color:white;border:1px solid var(--line)}.danger{background:#3a1520;color:#fecaca;border:1px solid rgba(239,68,68,.35)}.success{background:#113322;color:#bbf7d0;border:1px solid rgba(34,197,94,.35)}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;background:#071321;border-right:1px solid var(--line);padding:20px}.brand{font-size:20px;font-weight:950;margin-bottom:22px}.brand b{color:var(--cyan)}.tabs{display:grid;gap:7px}.tab{width:100%;text-align:left;background:transparent;color:#b7c8da;border:1px solid transparent;padding:11px;border-radius:11px;cursor:pointer;font-weight:800}.tab.active{background:#102844;color:white;border-color:var(--line)}.sidebar-foot{position:absolute;left:20px;right:20px;bottom:20px;display:grid;gap:8px}
.main{padding:26px 28px 80px;max-width:1200px;width:100%}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.savebar{display:flex;gap:8px;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.checkrow{display:flex;gap:14px;flex-wrap:wrap;background:#09182c;border:1px solid var(--line);padding:13px;border-radius:12px}.checkrow label{margin:0;display:flex;align-items:center;gap:7px}.checkrow input{width:auto}
.collection-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.items{display:grid;gap:13px}.item{background:var(--panel2);border:1px solid var(--line);border-radius:17px;padding:15px}.item-top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.item-title{font-weight:900}.actions{display:flex;gap:6px}.iconbtn{width:35px;height:35px;border-radius:10px;border:1px solid var(--line);background:#0b1b30;color:white;cursor:pointer}.iconbtn.del{color:#fecaca;background:#30131a}.visible{display:flex;align-items:center;gap:6px;font-size:12px;color:#c5d4e4}.visible input{width:auto}.image-line{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}.preview{margin-top:8px;width:140px;height:95px;border-radius:12px;object-fit:cover;background:#071528;border:1px solid var(--line)}.upload-note{font-size:11px;color:var(--muted);margin-top:5px}.status{font-size:12px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;background:#0c2b1c;color:#bbf7d0;border:1px solid rgba(34,197,94,.35);padding:12px 15px;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);z-index:50}.error{background:#36151c;color:#fecaca;border-color:rgba(239,68,68,.35)}
@media(max-width:850px){.app{display:block}.sidebar{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.tabs{display:flex;overflow:auto}.tab{white-space:nowrap;width:auto}.sidebar-foot{position:static;margin-top:14px;display:flex}.main{padding:18px}.grid2,.grid3{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand">SOLUCIONES <b>DIGITALES</b></div><h1>Panel de Administración</h1><p class="muted">Ingresá tu clave privada para editar el contenido de la página.</p><div class="field"><label>Clave de administrador</label><input type="password" id="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%" onclick="login()">Ingresar</button><p class="status" id="loginStatus"></p></div></div>
<div id="app" class="app hidden">
  <aside class="sidebar"><div class="brand">SOLUCIONES <b>DIGITALES</b></div><div class="tabs" id="tabs"></div><div class="sidebar-foot"><button class="btn soft" onclick="reloadData()">↻ Recargar</button><button class="btn danger" onclick="logout()">Salir</button></div></aside>
  <main class="main"><div class="top"><div><h1 id="pageTitle">Administrador</h1><div class="status">Los cambios se publican al presionar Guardar.</div></div><div class="savebar"><button class="btn soft" onclick="previewPublic()">Vista pública</button><button class="btn primary" onclick="saveAll()">Guardar cambios</button></div></div><div id="content"></div></main>
</div>
<script>
let TOKEN='', DATA=null, CURRENT='general';
const tabs=[['general','General'],['services','Servicios'],['projects','Trabajos'],['invitations','Invitaciones'],['audiences','Rubros'],['process','Proceso'],['contact','Contacto']];
const schemas={
 services:[['icon','Ícono','text'],['title','Título','text'],['desc','Descripción','textarea'],['tags','Etiquetas separadas por coma','tags']],
 projects:[['title','Título','text'],['desc','Descripción','textarea'],['image','Imagen','image'],['link','Enlace del proyecto (opcional)','text']],
 invitations:[['image','Imagen','image'],['alt','Descripción de la imagen','text']],
 audiences:[['title','Título','text'],['desc','Descripción','textarea']],
 process:[['title','Título','text'],['desc','Descripción','textarea']]
};
const defaults={services:{icon:'✨',title:'Nuevo servicio',desc:'Descripción del servicio',tags:[],visible:true},projects:{title:'Nuevo trabajo',desc:'Descripción del trabajo',image:'',link:'',visible:true},invitations:{image:'',alt:'Nueva invitación',visible:true},audiences:{title:'Nuevo rubro',desc:'Descripción',visible:true},process:{title:'Nuevo paso',desc:'Descripción',visible:true}};
function $(id){return document.getElementById(id)}
function toast(msg,err=false){const t=document.createElement('div');t.className='toast'+(err?' error':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function login(){const p=$('password').value;$('loginStatus').textContent='Ingresando…';google.script.run.withSuccessHandler(r=>{TOKEN=r.token;DATA=r.data;$('login').classList.add('hidden');$('app').classList.remove('hidden');buildTabs();showTab('general');}).withFailureHandler(e=>{$('loginStatus').textContent=e.message||e;}).loginAdmin(p)}
function logout(){TOKEN='';DATA=null;$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''}
function buildTabs(){ $('tabs').innerHTML=tabs.map(([id,name])=>`<button class="tab" data-id="${id}" onclick="showTab('${id}')">${name}</button>`).join('') }
function showTab(id){CURRENT=id;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.id===id));$('pageTitle').textContent=tabs.find(x=>x[0]===id)?.[1]||'Administrador'; if(id==='general')renderGeneral();else if(id==='contact')renderContact();else renderCollection(id)}
function field(label,value,path,type='text'){const val=String(value??'').replace(/"/g,'&quot;'); if(type==='textarea')return `<div class="field"><label>${label}</label><textarea oninput="setPath('${path}',this.value)">${String(value??'').replace(/</g,'&lt;')}</textarea></div>`; return `<div class="field"><label>${label}</label><input value="${val}" oninput="setPath('${path}',this.value)"></div>`}
function setPath(path,value){const p=path.split('.');let o=DATA;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=value}
function renderGeneral(){const s=DATA.site;const sec=DATA.sections||{};$('content').innerHTML=`<div class="panel"><h2>Identidad y portada</h2><div class="grid2">${field('Nombre principal',s.brandLeft,'site.brandLeft')}${field('Palabra destacada',s.brandAccent,'site.brandAccent')}${imageField('Logo',s.logo,'site.logo')}${field('Texto superior',s.heroPill,'site.heroPill')}${field('Título principal',s.heroTitleMain,'site.heroTitleMain')}${field('Título destacado',s.heroTitleAccent,'site.heroTitleAccent')}</div>${field('Descripción principal',s.heroDescription,'site.heroDescription','textarea')}<div class="grid2">${field('Texto botón principal',s.heroPrimaryLabel,'site.heroPrimaryLabel')}${field('Texto botón secundario',s.heroSecondaryLabel,'site.heroSecondaryLabel')}${field('Texto botón WhatsApp',s.navWhatsAppLabel,'site.navWhatsAppLabel')}${imageField('Imagen principal',s.heroImage,'site.heroImage')}${field('Etiqueta flotante 1',s.heroFloat1,'site.heroFloat1')}${field('Etiqueta flotante 2',s.heroFloat2,'site.heroFloat2')}</div><div class="field"><label>Beneficios bajo la portada, uno por línea</label><textarea oninput="DATA.site.trustItems=this.value.split('\\n').map(x=>x.trim()).filter(Boolean)">${(s.trustItems||[]).join('\n')}</textarea></div><h3>Mostrar u ocultar secciones</h3><div class="checkrow">${[['services','Servicios'],['projects','Trabajos'],['invitations','Invitaciones'],['audiences','Rubros'],['process','Proceso'],['contact','Contacto']].map(([k,n])=>`<label><input type="checkbox" ${sec[k]!==false?'checked':''} onchange="DATA.sections['${k}']=this.checked"> ${n}</label>`).join('')}</div></div>`}
function imageField(label,value,path){const id='file_'+Math.random().toString(36).slice(2);return `<div class="field"><label>${label}</label><div class="image-line"><input value="${String(value||'').replace(/"/g,'&quot;')}" oninput="setPath('${path}',this.value)"><label class="btn soft" style="margin:0;cursor:pointer">Subir<input id="${id}" type="file" accept="image/*" hidden onchange="uploadImage(this,'${path}')"></label></div>${value && (/^(https?:|data:)/.test(value))?`<img class="preview" src="${value}">`:value?`<div class="upload-note">Imagen actual: ${value}</div>`:''}<div class="upload-note">Podés pegar una URL o subir una imagen (máx. 5 MB).</div></div>`}
function renderCollection(type){const arr=DATA[type]||[];const name=tabs.find(x=>x[0]===type)?.[1]||type;$('content').innerHTML=`<div class="panel"><div class="collection-head"><div><h2 style="margin:0">${name}</h2><div class="status">Agregá, editá, ocultá, reordená o eliminá elementos.</div></div><button class="btn primary" onclick="addItem('${type}')">+ Agregar</button></div><div class="items">${arr.map((item,i)=>renderItem(type,item,i)).join('')||'<div class="muted">No hay elementos.</div>'}</div></div>`}
function renderItem(type,item,i){const title=item.title||item.alt||('Elemento '+(i+1));return `<div class="item"><div class="item-top"><div><div class="item-title">${title}</div><label class="visible"><input type="checkbox" ${item.visible!==false?'checked':''} onchange="DATA['${type}'][${i}].visible=this.checked"> Visible</label></div><div class="actions"><button class="iconbtn" onclick="moveItem('${type}',${i},-1)">↑</button><button class="iconbtn" onclick="moveItem('${type}',${i},1)">↓</button><button class="iconbtn del" onclick="deleteItem('${type}',${i})">✕</button></div></div><div class="grid2">${schemas[type].map(([key,label,kind])=>collectionField(type,i,key,label,kind,item[key])).join('')}</div></div>`}
function collectionField(type,i,key,label,kind,value){const path=`${type}.${i}.${key}`;if(kind==='image')return imageField(label,value,path);if(kind==='textarea')return field(label,value,path,'textarea');if(kind==='tags'){return field(label,(value||[]).join(', '),path+'_TAGS')}return field(label,value,path)}
const originalSetPath=setPath;setPath=function(path,value){if(path.endsWith('_TAGS')){path=path.slice(0,-5);value=value.split(',').map(x=>x.trim()).filter(Boolean)}originalSetPath(path,value)}
function addItem(type){DATA[type]=DATA[type]||[];DATA[type].push(JSON.parse(JSON.stringify(defaults[type])));renderCollection(type)}
function deleteItem(type,i){if(confirm('¿Eliminar este elemento?')){DATA[type].splice(i,1);renderCollection(type)}}
function moveItem(type,i,d){const j=i+d;if(j<0||j>=DATA[type].length)return;[DATA[type][i],DATA[type][j]]=[DATA[type][j],DATA[type][i]];renderCollection(type)}
function renderContact(){const s=DATA.site;$('content').innerHTML=`<div class="panel"><h2>Contacto y WhatsApp</h2><div class="grid2">${field('Número WhatsApp con código de país',s.whatsapp,'site.whatsapp')}${field('Mensaje del botón WhatsApp',s.whatsappMessage,'site.whatsappMessage')}${field('Texto botón del formulario',s.contactButtonLabel,'site.contactButtonLabel')}</div>${field('Título de contacto',s.contactTitle,'site.contactTitle')}${field('Descripción',s.contactDescription,'site.contactDescription','textarea')}<div class="grid2">${field('Etiqueta',s.contactKicker,'site.contactKicker')}${field('Texto del pie de página',s.footerText,'site.footerText')}</div><div class="field"><label>Opciones del formulario, una por línea</label><textarea oninput="DATA.contactOptions=this.value.split('\\n').map(x=>x.trim()).filter(Boolean)">${(DATA.contactOptions||[]).join('\n')}</textarea></div><h3>Títulos de secciones</h3><div class="grid2">${field('Servicios - etiqueta',s.servicesKicker,'site.servicesKicker')}${field('Servicios - título',s.servicesTitle,'site.servicesTitle')}${field('Servicios - descripción',s.servicesDescription,'site.servicesDescription','textarea')}${field('Portfolio - etiqueta',s.portfolioKicker,'site.portfolioKicker')}${field('Portfolio - título',s.portfolioTitle,'site.portfolioTitle')}${field('Portfolio - descripción',s.portfolioDescription,'site.portfolioDescription','textarea')}${field('Invitaciones - etiqueta',s.invitationsKicker,'site.invitationsKicker')}${field('Invitaciones - título',s.invitationsTitle,'site.invitationsTitle')}${field('Invitaciones - descripción',s.invitationsDescription,'site.invitationsDescription','textarea')}${field('Rubros - etiqueta',s.audiencesKicker,'site.audiencesKicker')}${field('Rubros - título',s.audiencesTitle,'site.audiencesTitle')}${field('Proceso - etiqueta',s.processKicker,'site.processKicker')}${field('Proceso - título',s.processTitle,'site.processTitle')}</div></div>`}
function saveAll(){google.script.run.withSuccessHandler(()=>toast('Cambios guardados y publicados.')).withFailureHandler(e=>toast(e.message||e,true)).saveAdminData(TOKEN,DATA)}
function reloadData(){google.script.run.withSuccessHandler(d=>{DATA=d;showTab(CURRENT);toast('Datos recargados.');}).withFailureHandler(e=>toast(e.message||e,true)).getAdminData(TOKEN)}
function uploadImage(input,path){const f=input.files&&input.files[0];if(!f)return;if(f.size>5*1024*1024){toast('La imagen supera 5 MB.',true);input.value='';return}const r=new FileReader();r.onload=()=>{toast('Subiendo imagen…');google.script.run.withSuccessHandler(out=>{setPath(path,out.url);showTab(CURRENT);toast('Imagen subida.');}).withFailureHandler(e=>toast(e.message||e,true)).uploadAdminImage(TOKEN,r.result,f.name)};r.readAsDataURL(f)}
function previewPublic(){window.open(location.href.replace(/\?.*$/,'').replace(/script\.google\.com.*/,'about:blank'),'_blank');toast('La vista pública es tu página de GitHub. Abrila desde tu enlace habitual.');}
</script>
</body></html>
